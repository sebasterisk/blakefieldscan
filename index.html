<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>view</title>
    <link rel="stylesheet" href="style.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap');
    </style>
</head>
<body>
    <!-- DISPLAY AREA -->
    <div id="catchall">
        <!-- all elements are position: absolute, order should NOT matter -->
        <div id="title" class="roboto-narrowbold size1 tight">  information     </div>
        <div id="clock" class="roboto-narrowbold size1 tight">  12:56           </div>
        <div id="date" class="roboto-narrow size3">     August 12, 2036 </div>

        <!-- MAIN content area -->
        <div id="contentarea1">
            <div id="image-content" class="transitional">
                <img src="" id="display-image">
            </div>

            <div id="weather-content" class="transitional">
                <img src="https://api.weather.gov/icons/land/night/rain?size=medium" id="weather-icon">
                <div id="weather-temp" class="roboto-narrowbold tight size1">111&deg;</div>
                <div id="weather-status" class="roboto-narrow tight size3">Mostly Cloudy</div>
                <ul id="weather-etc" class="list roboto-narrow size4 static-for-children de-emph">
                    <li>Wind <span id="weather-wind-dir"></span> <span id="weather-wind-sp"></span> mph</li>
                    <li>Humidity <span id="weather-humid"></span>%</li>
                    <li>Pressure <span id="weather-pres"></span>"</li>
                </ul>

                <div id="weather-forecast" class="static-for-children roboto-narrow size4 tight flex vertically">
                    <div id="forecast-1" class="weather-forecast-segment flex"></div>
                    <div id="forecast-2" class="weather-forecast-segment flex"></div>
                    <div id="forecast-3" class="weather-forecast-segment flex"></div>
                    <div id="forecast-4" class="weather-forecast-segment flex"></div>
                    <div id="forecast-5" class="weather-forecast-segment flex"></div>
                
                    <template>
                        <span class="roboto-narrowbold weather-forecast-day block">TODAY</span>
                        <span class="roboto-narrow size3 weather-forecast-temp">111&deg;</span>
                        <img src="https://api.weather.gov/icons/land/night/rain?size=medium" class="weather-forecast-icon">
                        <span class="roboto-narrow size3 weather-forecast-chance de-emph">60%</span>
                    </template>
                </div>
            </div>

            <div id="sched-content" class="transitional">
                <div id="next-up" class="roboto-narrow de-emph static-for-children size3">
                    <div id="next-up-label" class="flex-one roboto-condbolder"></div>
                    <div id="next-up-time" class="yellow roboto-narrowbold size1"><span id="next-up-time-readout">0</span><span class="size3 roboto-narrow"> min</span></div>
                </div>

                <div id="schedule-mission" class="dark roboto-condbold">NORM(AUTO)</div>

                <div id="schedule" class="roboto-narrow flex vertically static-for-children de-emph altflex">
                    <template id="schedule-element-temp">
                        <div class="schedule-element flex-one flex static-for-children size6">
                            <span class="period-name block flex-one">Period 1</span>
                            <span class="period-time block flex-one roboto-condbold">8:05 &ndash; 9:05</span>
                        </div>
                    </template>
                    <template id="dual-schedule-element-temp">
                        <div class="dual-schedule-element flex-one flex static-for-children size6">
                            <span class="period-name block flex-one">Period 3</span>
                            <span class="period-time-f block flex-one roboto-condbold">8:05 &ndash; 9:05</span>
                            <span class="period-time-l block flex-one roboto-condbold">8:05 &ndash; 9:05</span>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- SIDEBAR content area -->
        <div id="contentarea2" class="">
            <div id="sidebar-events">
                <span id="sidetitle" class="roboto-condbolder size4 sub">TODAY'S EVENTS</span>
                <ul class="roboto-narrow altlist size5 tight">
                    <!-- items here -->
                </ul>
            </div>
        </div>

        <div id="products" class="roboto-condbolder size4 sub"></div>

        <div id="ticker" class="marquee">
            <div id="ticker-content" class="roboto-narrow size3">
                <!-- items here -->
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="scripts/clock.js"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/retrieve.js"></script>
    <script src="scripts/calendar.js" type="module"></script>
    <script src="scripts/weather.js"></script>
</body>
</html>
