<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>configuration!!</title>
    <link rel="stylesheet" href="conf-style.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap');
    </style>
</head>
<body>
    <h1>configure</h1>
    for now, you'll have to edit the JSON directly but I'll fix it later trust
    <br>
    this is the current config, change it then hit 'run it'. screens should update within 10 mins
    <br>

    <textarea id="config"></textarea>
    <br>
    <button id="button" onclick="post()">run it</button>
    <span id="message"></span>

    <script>
        let result
        async function get(){
            let current_config
            try {
                const data = await fetch("/server/config.php")
                if (!data.ok) {
                    throw new Error(`Getting config returned ${data.status}`)
                }

                result = await data.json();
                console.log(result);
            } catch (error) {
                console.error(error.message);
            }

            current_config = result
            document.querySelector("#config").innerHTML = JSON.stringify(result, null, 4)
        }

        async function post() {
            document.querySelector("#button").disabled = true
            try {
                const response = await fetch("/server/config.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: document.querySelector("#config").value
                });

                const resptext = await response.text()
                document.querySelector("#message").innerHTML += `The server responded with ${response.status}. ${resptext}`
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                location.reload()
            } catch (error) {
                console.error("Error:", error);
            }
        }

        get()
    </script>
</body>
</html>
